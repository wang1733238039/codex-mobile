name: Personal mobile builds
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'packages/mobile-core/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/personal-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: node scripts/mobile/gradle.mjs :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: codex-mobile-android-debug
          path: .build/native/android/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: >-
          xcodebuild -project apps/ios/CodexManage.xcodeproj
          -scheme CodexManage -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
